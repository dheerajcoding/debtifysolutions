# One-command production-style run: MongoDB + Debtify on http://localhost:5000
#   docker compose up --build
# Set JWT_SECRET, ENCRYPTION_KEY and ADMIN_PASSWORD before using this anywhere public.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/debtify
      APP_URL: http://localhost:5000
      CLIENT_ORIGIN: http://localhost:5000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-to-another-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@debtify.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe2026}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_SAMPLES: ${SEED_SAMPLES:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Debtify <no-reply@debtify.local>}

volumes:
  mongo-data:
